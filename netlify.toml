# Netlify build, functions and headers. Pushes to main deploy automatically.

[build]
  command = "node build.mjs"
  publish = "dist"

# The order endpoint (/api/order). Secrets it needs, set in Netlify's
# environment variables, never in this repo: SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY. The build also reads SUPABASE_URL and
# SUPABASE_ANON_KEY (public by design) for the cart and the tablet.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The staff tablet: never indexed, never cached, never framed.
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    Content-Security-Policy = "frame-ancestors 'none'"
